<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Contact – ConvertFlux</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Convert<span>Flux</span></a>
    <nav class="main-nav">
      <a href="index.html#pdf-tools">PDF Tools</a>
      <a href="index.html#image-tools">Image Tools</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>
<section style="max-width:600px;margin:60px auto;padding:0 1.5rem 80px">
  <h1 style="font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:0.5rem">Contact Us</h1>
  <p style="color:var(--text2);margin-bottom:2rem">Have a suggestion, found a bug, or need help? Reach out below.</p>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem">
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:0.4rem">Your Name</label>
      <input type="text" placeholder="Rahul Sharma" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.6rem 0.9rem;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none"/>
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:0.4rem">Email Address</label>
      <input type="email" placeholder="you@email.com" style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.6rem 0.9rem;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none"/>
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);margin-bottom:0.4rem">Message</label>
      <textarea rows="5" placeholder="Tell us what you think..." style="width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.6rem 0.9rem;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none;resize:vertical"></textarea>
    </div>
    <p style="color:var(--text3);font-size:0.82rem;margin-bottom:1rem">Note: This form is a template. To make it work, connect it to <a href="https://formspree.io" target="_blank" style="color:var(--accent)">Formspree.io</a> (free) or EmailJS.</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem">Send Message</button>
  </div>
</section>
<footer class="site-footer">
  <div class="footer-bottom"><p>&copy; 2024 ConvertFlux. All processing done locally in your browser.</p></div>
</footer>
</body>
</html>
